server {
    listen 80;
    server_name _;

    location = / {
        return 302 /orbit/;
    }

    # Paymob and email links may omit the /orbit/ prefix configured in production baseHref.
    location = /activate {
        return 302 /orbit/activate$is_args$args;
    }

    location = /payment/callback {
        return 302 /orbit/payment/callback$is_args$args;
    }

    # ─────────────────────────────────────────────────────────────────────
    # The Angular SPA.
    #
    # Split into three locations on purpose. With a single `try_files $uri
    # $uri/ /orbit/index.html` covering everything, a request for a bundle
    # that no longer exists fell through to index.html and was answered
    # 200 text/html. The browser then tried to execute an HTML document as
    # JavaScript, threw "Unexpected token '<'", and never bootstrapped — a
    # white screen with nothing in the UI to explain it.
    #
    # That happened on every deploy: production builds with outputHashing,
    # so bundles are main-<hash>.js and the old ones are deleted when the
    # image is replaced. index.html was served with no Cache-Control, only
    # ETag/Last-Modified, so browsers fell back to heuristic caching and
    # phones kept asking for the previous build's filenames.
    # ─────────────────────────────────────────────────────────────────────

    # Hashed build output. The filename changes whenever the contents do, so
    # it can be cached indefinitely. `=404` is the important part: a bundle
    # that is gone must fail as a missing file, never as an HTML page.
    location ~* ^/orbit/.+\.(?:js|css|map|woff2?)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        # No `always`: that would put a one-year immutable header on the 404
        # too, and a browser is entitled to cache that. A rollback, or a
        # rebuild that produces the same hash, would then keep failing from
        # cache with nothing on the server to blame. Without it the header is
        # limited to 2xx/3xx, which still covers the 304 revalidations.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets keep their filenames across deploys (assets/logo.svg is
    # always assets/logo.svg), so they must revalidate rather than be pinned
    # for a year. `^~` outranks the regex above, which is what keeps a .js
    # under assets/ on this shorter policy.
    location ^~ /orbit/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Navigation requests. index.html is the one file that must never be
    # served stale — it is the map to every hashed filename above, so a
    # cached copy points at bundles that may already be deleted. no-cache
    # still allows a 304, it just forbids using it without asking.
    location /orbit/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /orbit/index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Orbit Bazaar. Unlike /orbit/, nothing here is served from disk: the shop
    # container runs one Node process that serves both its Angular bundle and
    # /shop/api, so this is a pure reverse proxy with no try_files and no root.
    # Without this, /shop would 404 — location /shop/ does not match it, and the
    # SPA's relative asset URLs would resolve one path segment too high.
    location = /shop {
        return 302 /shop/$is_args$args;
    }

    location /shop/ {
        proxy_pass http://shop:4000/shop/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Checkout is the slow path: the dummy card processor sleeps 800-1500 ms
        # (CONTRACT §7) and an Orbit wallet call can run the full 15 s
        # ORBIT_TIMEOUT_MS (§8). The shop must be the one to time out, not nginx
        # — an nginx 504 would surface as a failure on a request that may still
        # have debited the wallet, which is exactly the double-charge the
        # uncertain-payment path exists to prevent.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
