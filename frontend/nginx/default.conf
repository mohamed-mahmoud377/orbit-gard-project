server {
    listen 80;
    server_name _;

    location = / {
        return 302 /orbit/;
    }

    # Paymob and email links may omit the /orbit/ prefix configured in production baseHref.
    location = /activate {
        return 302 /orbit/activate$is_args$args;
    }

    location = /payment/callback {
        return 302 /orbit/payment/callback$is_args$args;
    }

    location /orbit/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /orbit/index.html;
    }

    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Orbit Bazaar. Unlike /orbit/, nothing here is served from disk: the shop
    # container runs one Node process that serves both its Angular bundle and
    # /shop/api, so this is a pure reverse proxy with no try_files and no root.
    # Without this, /shop would 404 — location /shop/ does not match it, and the
    # SPA's relative asset URLs would resolve one path segment too high.
    location = /shop {
        return 302 /shop/$is_args$args;
    }

    location /shop/ {
        proxy_pass http://shop:4000/shop/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Checkout is the slow path: the dummy card processor sleeps 800-1500 ms
        # (CONTRACT §7) and an Orbit wallet call can run the full 15 s
        # ORBIT_TIMEOUT_MS (§8). The shop must be the one to time out, not nginx
        # — an nginx 504 would surface as a failure on a request that may still
        # have debited the wallet, which is exactly the double-charge the
        # uncertain-payment path exists to prevent.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
