server {
    listen 80;
    server_name _;

    location = / {
        return 302 /orbit/;
    }

    # Paymob and email links may omit the /orbit/ prefix configured in production baseHref.
    location = /activate {
        return 302 /orbit/activate$is_args$args;
    }

    location = /payment/callback {
        return 302 /orbit/payment/callback$is_args$args;
    }

    location /orbit/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /orbit/index.html;
    }

    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
