# Production stack for the server (/root/orbit/docker-compose.yml).
# The GitHub Actions "Deploy" workflow copies this file to the server and runs
# `docker compose up -d`. The `db` service intentionally matches the existing
# server definition so the running database and its volume are left untouched.
#
# Required variables (read from /root/orbit/.env on the server):
#   POSTGRES_PASSWORD  - database password (already present)
# Optional (injected by the deploy workflow):
#   APP_IMAGE          - backend image tag; defaults to :backend-latest
#   WEB_IMAGE          - frontend/nginx image tag; defaults to :frontend-latest

services:
  db:
    image: postgres:17-alpine
    container_name: orbit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposed publicly for direct external DB clients (0.0.0.0:5432).
      # Postgres is reachable from the internet — the password is the only guard.
      - "5432:5432"
    volumes:
      - orbit-db-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-ghcr.io/mohamed-mahmoud377/orbit-gard-project:backend-latest}
    container_name: orbit-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/orbit
      DB_USERNAME: orbit
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    healthcheck:
      # context-path is /api/v1, HealthController maps /ping -> /api/v1/ping
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: ${WEB_IMAGE:-ghcr.io/mohamed-mahmoud377/orbit-gard-project:frontend-latest}
    container_name: orbit-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  orbit-db-data:
