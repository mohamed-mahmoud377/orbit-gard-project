services:
  postgres:
    image: postgres:17
    container_name: orbit-gard-postgres
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit123
    ports:
      - "5432:5432"
    volumes:
      - orbit-gard-pgdata:/var/lib/postgresql/data

volumes:
  orbit-gard-pgdata:
