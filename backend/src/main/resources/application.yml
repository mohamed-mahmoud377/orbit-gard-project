spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: orbit-graduation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbit}
    username: ${DB_USERNAME:orbit}
    password: ${DB_PASSWORD:orbit123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}

orbitgard:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 300
paymob:
  base-url: ${PAYMOB_BASE_URL:https://accept.paymob.com}
  api-key: ${PAYMOB_API_KEY:not-configured}
  secret-key: ${PAYMOB_SECRET_KEY}
  public-key: ${PAYMOB_PUBLIC_KEY}
  hmac-secret: ${PAYMOB_HMAC_SECRET:not-configured}
  callback-url: ${PAYMOB_CALLBACK_URL:http://localhost:4200/payment/callback}
  notification-url: ${PAYMOB_NOTIFICATION_URL:http://localhost:8080/api/v1/paymob/webhook}
  payment-method-ids: ${PAYMOB_PAYMENT_METHOD_IDS:}
  connect-timeout: PT5S
  read-timeout: PT20S