spring:
  datasource:
    url: jdbc:h2:mem:orbitgard;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025

app:
  frontend:
    base-url: http://localhost:4200
  jwt:
    secret: test-jwt-secret-at-least-32-characters-long

orbitgard:
  jwt:
    secret: test-jwt-secret-at-least-32-characters-long
