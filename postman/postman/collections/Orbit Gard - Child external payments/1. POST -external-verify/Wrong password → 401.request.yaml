$kind: http-request
url: "{{baseUrl}}/external/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{childAUsername}}",
      "password": "DefinitelyWrong123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('INVALID_CREDENTIALS', () => {
          pm.expect(pm.response.json().code).to.eql('INVALID_CREDENTIALS');
      });
    language: text/javascript
order: 2000
