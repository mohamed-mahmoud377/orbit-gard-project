$kind: http-request
description: Account-existence must not be observable through this endpoint — it is reachable without any authentication.
url: "{{baseUrl}}/external/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "no.such.child.999999",
      "password": "DefinitelyWrong123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // verify() hashes against a dummy hash when no user exists, so a
      // merchant terminal cannot tell 'no such account' from 'wrong password'.
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('Identical code to a wrong password', () => {
          pm.expect(pm.response.json().code).to.eql('INVALID_CREDENTIALS');
      });
      pm.test('Body does not hint that the account is missing', () => {
          const text = pm.response.text().toLowerCase();
          pm.expect(text).to.not.include('not found');
          pm.expect(text).to.not.include('no such');
      });
    language: text/javascript
order: 3000
