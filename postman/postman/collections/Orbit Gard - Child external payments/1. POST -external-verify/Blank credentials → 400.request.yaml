$kind: http-request
url: "{{baseUrl}}/external/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "",
      "password": ""
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('FIELD_REQUIRED on both fields', () => {
          const fields = (pm.response.json().fieldErrors || []).map(e => e.field);
          pm.expect(fields).to.include('username');
          pm.expect(fields).to.include('password');
      });
    language: text/javascript
order: 4000
