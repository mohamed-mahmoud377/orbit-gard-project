$kind: http-request
url: "{{baseUrl}}/family/overview"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const cents = (v) => Math.round(Number(v) * 100);
      const o = pm.response.json();
      pm.test('Two blocked attempts across the family', () => {
          pm.expect(o.blockedAttempts).to.be.at.least(2);
      });
      pm.test('Spending total excludes the blocked amounts', () => {
          pm.expect(cents(o.spentThisMonth)).to.be.at.least(15000);
      });
    language: text/javascript
order: 3000
