$kind: http-request
url: "{{baseUrl}}/family/children/{{childAId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const cents = (v) => Math.round(Number(v) * 100);
      const c = pm.response.json();
      pm.test('Spent today is 60 + 50, the blocked 61 excluded', () => {
          pm.expect(cents(c.limits.today.spent)).to.eql(11000);
      });
    language: text/javascript
order: 4000
