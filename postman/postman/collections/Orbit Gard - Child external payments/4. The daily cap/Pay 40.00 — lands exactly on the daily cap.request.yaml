$kind: http-request
url: "{{baseUrl}}/external/pay"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "verificationToken": "{{payToken}}",
      "merchantName": "Book fair",
      "productName": "Notebook set",
      "cashAmount": 40.0
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const cents = (v) => Math.round(Number(v) * 100);
      // 60 + 50 + 40 = 150.00, exactly the daily limit. Not greater, so allowed.
      pm.test('201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
