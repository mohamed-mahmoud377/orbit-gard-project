$kind: http-request
url: "{{baseUrl}}/family/children/{{childAId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const cents = (v) => Math.round(Number(v) * 100);
      const c = pm.response.json();
      pm.test('Spent equals the ceiling', () => {
          pm.expect(cents(c.limits.today.spent)).to.eql(15000);
          pm.expect(cents(c.limits.today.max)).to.eql(15000);
      });
      pm.test('Remaining is 0, never negative', () => {
          pm.expect(cents(c.limits.today.remaining)).to.eql(0);
      });
    language: text/javascript
order: 3000
