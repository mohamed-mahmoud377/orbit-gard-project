$kind: http-request
url: "{{baseUrl}}/external/pay"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "verificationToken": "not.a.real.jwt",
      "merchantName": "School canteen",
      "productName": "Sandwich",
      "cashAmount": 10.0
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('TOKEN_INVALID', () => pm.expect(pm.response.json().code).to.eql('TOKEN_INVALID'));
      pm.test('Never a 500', () => pm.expect(pm.response.code).to.not.eql(500));
    language: text/javascript
order: 1000
