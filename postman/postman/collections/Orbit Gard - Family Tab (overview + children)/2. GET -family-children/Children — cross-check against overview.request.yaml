$kind: http-request
description: "The strongest test here: the two endpoints derive the same figure by different routes (one set-wide query vs one query per child)."
url: "{{baseUrl}}/family/children"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Money arrives as JSON numbers; compare in integer cents so 0.1+0.2 never bites.
      const cents = (v) => Math.round(Number(v) * 100);
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const rows = pm.response.json();

      pm.sendRequest({
          url: pm.collectionVariables.get('baseUrl') + '/family/overview',
          method: 'GET',
          header: { Authorization: 'Bearer ' + pm.collectionVariables.get('accessToken') }
      }, (err, res) => {
          pm.test('Overview fetch for cross-check succeeded', () => {
              pm.expect(err).to.be.null;
              pm.expect(res.code).to.eql(200);
          });
          const o = res.json();

          pm.test('childrenCount === children.length', () => {
              pm.expect(o.childrenCount).to.eql(rows.length);
          });

          // Both read the same COMPLETED-debit sum over the same UTC month
          // window, so these must agree to the cent. Drift here means the two
          // endpoints are cutting the month differently.
          const summed = rows.reduce((t, c) => t + cents(c.limits.month.spent), 0);
          pm.test('spentThisMonth === sum of every child month.spent', () => {
              pm.expect(cents(o.spentThisMonth)).to.eql(summed);
          });
      });
    language: text/javascript
order: 2000
