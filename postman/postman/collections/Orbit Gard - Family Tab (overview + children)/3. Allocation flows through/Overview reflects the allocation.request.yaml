$kind: http-request
description: Allocation counts the credit leg into a child wallet. Money the parent sends to a non-child must not appear here.
url: "{{baseUrl}}/family/overview"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Money arrives as JSON numbers; compare in integer cents so 0.1+0.2 never bites.
      const cents = (v) => Math.round(Number(v) * 100);
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      const before = cents(pm.collectionVariables.get('snapAllocated'));
      const moved = cents(pm.collectionVariables.get('allocationAmount'));

      pm.test('allocatedThisMonth rose by exactly the amount sent', () => {
          pm.expect(cents(b.allocatedThisMonth)).to.eql(before + moved);
      });

      pm.test('Allocating did not move spentThisMonth', () => {
          pm.expect(cents(b.spentThisMonth)).to.eql(cents(pm.collectionVariables.get('snapSpent')));
      });

      pm.collectionVariables.set('snapAllocated', b.allocatedThisMonth);
    language: text/javascript
order: 2000
