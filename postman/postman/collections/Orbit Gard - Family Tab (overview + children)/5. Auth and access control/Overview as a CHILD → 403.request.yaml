$kind: http-request
description: A child must not see the household's aggregate spend.
url: "{{baseUrl}}/family/overview"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{childToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
      pm.test('No family data leaked in the error body', () => {
          pm.expect(pm.response.text()).to.not.include('childrenCount');
      });
    language: text/javascript
order: 3000
