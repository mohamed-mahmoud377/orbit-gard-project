$kind: http-request
url: "{{baseUrl}}/wallet/internal/transfer"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "receiverUsername": "{{childBUsername}}",
      "amount": "{{spendAmount}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{childToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Transfer accepted', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
