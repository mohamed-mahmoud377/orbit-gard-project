$kind: http-request
url: "{{baseUrl}}/family/overview"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Money arrives as JSON numbers; compare in integer cents so 0.1+0.2 never bites.
      const cents = (v) => Math.round(Number(v) * 100);
      const b = pm.response.json();
      const before = cents(pm.collectionVariables.get('snapSpent'));
      const spent = cents(pm.collectionVariables.get('spendAmount'));

      pm.test('spentThisMonth rose by the amount spent', () => {
          pm.expect(cents(b.spentThisMonth)).to.eql(before + spent);
      });

      // KNOWN GAP — see the collection description. enforceIfChild throws
      // without persisting anything, and nothing in the codebase ever writes
      // TransactionStatus.REJECTED, so the block above left no trace. When
      // blocked-attempt recording lands, flip this to expect before + 1.
      pm.test('[known gap] blockedAttempts did NOT record the refused payment', () => {
          pm.expect(b.blockedAttempts).to.eql(Number(pm.collectionVariables.get('snapBlocked')));
      });
    language: text/javascript
order: 5000
