$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{email}}",
      "password": "{{password}}",
      "rememberMe": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 403', () => pm.response.to.have.status(403));
      pm.test('reports unverified account', () => pm.expect(pm.response.json().code).to.eql('ACCOUNT_NOT_VERIFIED'));
    language: text/javascript
order: 2000
