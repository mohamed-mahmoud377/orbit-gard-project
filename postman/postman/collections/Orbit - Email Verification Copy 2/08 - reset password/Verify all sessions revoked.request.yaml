$kind: http-request
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{resetRefreshTokenBeforeReset}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Old refresh token rejected", () => pm.response.to.have.status(401));
      pm.test("Invalid refresh token error", () => {
          pm.expect(pm.response.json().code).to.eql("INVALID_REFRESH_TOKEN");
      });
    language: text/javascript
order: 20000
