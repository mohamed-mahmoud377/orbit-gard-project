$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{email}}",
      "password": "{{password}}",
      "rememberMe": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Old password rejected", () => pm.response.to.have.status(401));
      pm.test("Invalid credentials error", () => {
          pm.expect(pm.response.json().code).to.eql("INVALID_CREDENTIALS");
      });
    language: text/javascript
order: 18000
