$kind: http-request
name: "Confirm: missing new password"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "",
      "confirmNewPassword": ""
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
