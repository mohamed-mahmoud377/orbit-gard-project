$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Orbit",
      "lastName": "Tester",
      "username": "!",
      "email": "bad-email",
      "phoneNumber": "123",
      "password": "short",
      "confirmPassword": "different"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 400', () => pm.response.to.have.status(400));
      pm.test('returns validation error envelope', () => pm.expect(pm.response.json().code).to.eql('VALIDATION_ERROR'));
      pm.test('includes field-level errors', () => pm.expect(pm.response.json().fieldErrors.length).to.be.above(0));
    language: text/javascript
order: 2000
