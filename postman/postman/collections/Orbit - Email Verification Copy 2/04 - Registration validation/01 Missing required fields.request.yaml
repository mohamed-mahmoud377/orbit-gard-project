$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 400', () => pm.response.to.have.status(400));
      pm.test('reports required fields', () => pm.expect(pm.response.json().code).to.eql('FIELD_REQUIRED'));
    language: text/javascript
order: 1000
