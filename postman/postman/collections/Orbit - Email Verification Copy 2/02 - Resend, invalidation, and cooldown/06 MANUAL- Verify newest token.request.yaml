$kind: http-request
name: "06 MANUAL: Verify newest token"
url: "{{baseUrl}}/api/v1/auth/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{verificationToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('activates account', () => pm.expect(pm.response.json().status).to.eql('ACTIVE'));
    language: text/javascript
order: 6000
