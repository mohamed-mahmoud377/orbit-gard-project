$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"{{email}}\",\r

    \    \"password\": \"FreshPass1\",\r

    \    \"rememberMe\": false\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"New password accepted\", () => pm.response.to.have.status(200));\r

      \r

      const json = pm.response.json();\r

      pm.collectionVariables.set(\"accessToken\", json.accessToken);"
    language: text/javascript
order: 13000
