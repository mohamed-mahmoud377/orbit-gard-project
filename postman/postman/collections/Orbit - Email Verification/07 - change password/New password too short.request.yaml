$kind: http-request
url: "{{baseUrl}}/api/v1/password/change"
method: POST
body:
  type: json
  content: "{ \r

    \    \"currentPassword\": \"{{testCurrentPassword}}\", \r

    \    \"newPassword\": \"Ab1\", \r

    \    \"confirmNewPassword\": \"Ab1\" \r

    \    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 400\", () => pm.response.to.have.status(400));\r

      pm.test(\"Length rule message\", () => {\r

      \    pm.expect(pm.response.text()).to.include(\"8 characters\");\r

      });"
    language: text/javascript
order: 2000
