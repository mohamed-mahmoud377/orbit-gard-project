$kind: http-request
url: "{{baseUrl}}/api/v1/password/change"
method: POST
body:
  type: json
  content: "{\r

    \  \"currentPassword\": \"{{testCurrentPassword}}\",\r

    \  \"newPassword\": \"{{tooLongPassword}}\",\r

    \  \"confirmNewPassword\": \"{{tooLongPassword}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 400\", () => {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      const json = pm.response.json();\r

      \r

      pm.test(\"Error code is validation error\", () => {\r

      \    pm.expect(json.code).to.eql(\"VALIDATION_ERROR\");\r

      });\r

      \r

      pm.test(\"fieldErrors contains the max-length message\", () => {\r

      \    pm.expect(json.fieldErrors).to.be.an(\"array\").that.is.not.empty;\r

      \r

      \    const newPasswordError = json.fieldErrors.find(fe => fe.field === \"newPassword\");\r

      \    pm.expect(newPasswordError, \"expected a fieldErrors entry for newPassword\").to.exist;\r

      \    pm.expect(newPasswordError.message).to.eql(\"Maximum 64 characters\");\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const longPass = \"Aa1\" + \"x\".repeat(65);\r

      pm.collectionVariables.set(\"tooLongPassword\", longPass);"
    language: text/javascript
order: 5000
