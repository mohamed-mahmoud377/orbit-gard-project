$kind: http-request
url: "{{baseUrl}}/api/v1/password/active-sessions-count"
method: GET
body:
  type: text
  content: "{\r

    \  \"currentPassword\": \"{{testCurrentPassword}}\",\r

    \  \"newPassword\": \"{{newPassword}}\",\r

    \  \"confirmNewPassword\": \"{{newPassword}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
settings: {}
order: 10000
