$kind: http-request
url: "{{baseUrl}}/api/v1/password/change"
method: POST
body:
  type: json
  content: "{ \r

    \    \"currentPassword\": \"{{testCurrentPassword}}\", \r

    \    \"newPassword\": \"ValidPass1\", \r

    \    \"confirmNewPassword\": \"ValidPass2\" \r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 400\", () => pm.response.to.have.status(400));\r

      pm.test(\"Correct error code\", () => {\r

      \    pm.expect(pm.response.json().type).to.include(\"password-confirmation-mismatch\");\r

      });"
    language: text/javascript
order: 6000
