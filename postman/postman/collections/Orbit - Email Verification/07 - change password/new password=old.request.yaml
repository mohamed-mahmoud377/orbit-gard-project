$kind: http-request
url: "{{baseUrl}}/api/v1/password/change"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    { 
        "currentPassword": "{{testCurrentPassword}}", 
        "newPassword": "{{testCurrentPassword}}", 
        "confirmNewPassword": "{{testCurrentPassword}}" 
        
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 409\", () => pm.response.to.have.status(409));\r

      pm.test(\"Correct error code\", () => {\r

      \    pm.expect(pm.response.json().type).to.include(\"password-reuse\");\r

      });"
    language: text/javascript
order: 8000
