$kind: http-request
url: "{{baseUrl}}/api/v1/password/change"
method: POST
body:
  type: json
  content: "{ \r

    \    \"currentPassword\": \"\", \r

    \    \"newPassword\": \"NewPass123\", \r

    \    \"confirmNewPassword\": \"NewPass123\" \r

    \    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 400\", () => pm.response.to.have.status(400));\r

      pm.test(\"Validation error type\", () => {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.title || json.detail).to.include(\"required\");\r

      });"
    language: text/javascript
order: 1000
