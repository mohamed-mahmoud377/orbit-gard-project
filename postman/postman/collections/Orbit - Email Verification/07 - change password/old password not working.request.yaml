$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{email}}",
      "password": "{{password}}",
      "rememberMe": false
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Old password rejected\", () => pm.response.to.have.status(401));\r

      pm.test(\"Invalid credentials error\", () => {\r

      \    pm.expect(pm.response.json().type).to.include(\"invalid-credentials\");\r

      });"
    language: text/javascript
order: 12000
