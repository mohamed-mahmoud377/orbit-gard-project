$kind: http-request
url: "{{baseUrl}}/api/v1/password/change"
method: POST
body:
  type: json
  content: "{\r

    \  \"currentPassword\": \"{{testCurrentPassword}}\",\r

    \  \"newPassword\": \"{{newPassword}}\",\r

    \  \"confirmNewPassword\": \"{{newPassword}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => pm.response.to.have.status(200));\r

      \r

      const json = pm.response.json();\r

      pm.test(\"Confirmation message correct\", () => {\r

      \    pm.expect(json.message).to.eql(\"Your password has been changed. Please sign in again.\");\r

      });\r

      pm.test(\"Device count matches baseline\", () => {\r

      \    pm.expect(json.devicesSignedOut).to.eql(pm.collectionVariables.get(\"initialDeviceCount\"));\r

      });\r

      \r

      // Roll the password forward so later requests in this run use the new one\r

      pm.collectionVariables.set(\"testCurrentPassword\", pm.collectionVariables.get(\"newPassword\"));"
    language: text/javascript
order: 11000
