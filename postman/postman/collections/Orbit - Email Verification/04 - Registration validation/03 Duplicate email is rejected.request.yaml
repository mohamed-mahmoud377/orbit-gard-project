$kind: http-request
description: Run after any successful registration.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Orbit",
      "lastName": "Duplicate",
      "username": "duplicate{{username}}",
      "email": "{{email}}",
      "phoneNumber": "+201512345678",
      "password": "{{password}}",
      "confirmPassword": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 400 or 409', () => pm.expect([400, 409]).to.include(pm.response.code));
      const body = pm.response.json();
      pm.test('identifies the email conflict', () => pm.expect(body.fieldErrors.some(error => error.field === 'email' && error.code === 'EMAIL_TAKEN')).to.be.true);
    language: text/javascript
order: 3000
