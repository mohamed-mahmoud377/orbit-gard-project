$kind: http-request
url: "{{baseUrl}}/api/v1/payments/webhook/paymob"
method: POST
headers:
  Content-Type: application/json
  hmac: not-a-valid-signature
body:
  type: text
  content: |-
    {
      "obj": {
        "id": 100000001,
        "amount_cents": 5000,
        "created_at": "2026-08-03T10:00:00.000000",
        "currency": "EGP",
        "order": { "id": 1, "merchant_order_id": "{{paymentId}}" }
      },
      "type": "TRANSACTION"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('rejects the signature', () => pm.expect(pm.response.text()).to.eql('invalid signature'));
    language: text/javascript
order: 2000
