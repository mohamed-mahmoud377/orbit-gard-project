$kind: http-request
url: "{{baseUrl}}/api/v1/payments/{{paymentId}}/status"
method: GET
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('accepts the verified webhook', () => pm.response.to.have.status(200));
      pm.test('returns OK', () => pm.expect(pm.response.text()).to.eql('OK'));
    language: text/javascript
settings: {}
order: 3000
