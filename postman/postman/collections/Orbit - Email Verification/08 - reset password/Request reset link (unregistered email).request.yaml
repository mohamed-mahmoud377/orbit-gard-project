$kind: http-request
url: "{{baseUrl}}/api/v1/password/reset/request"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{unregisteredEmail}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Identical generic message", () => {
          pm.expect(json.message).to.eql("If an account exists for that address, a reset link is on its way.");
      });
      const registeredTime = pm.collectionVariables.get("registeredResetResponseTime");
      const unregisteredTime = pm.response.responseTime;
      pm.test("Response times are in the same rough range (timing-safe smoke check)", () => {
          pm.expect(Math.abs(registeredTime - unregisteredTime)).to.be.below(150);
      });
    language: text/javascript
order: 5000
