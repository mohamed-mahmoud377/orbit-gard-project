$kind: http-request
name: "Confirm: passwords do not match"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "ValidPass1",
      "confirmNewPassword": "Different1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Correct error code", () => {
          pm.expect(pm.response.json().code).to.eql("PASSWORD_CONFIRMATION_MISMATCH");
      });
    language: text/javascript
order: 10000
