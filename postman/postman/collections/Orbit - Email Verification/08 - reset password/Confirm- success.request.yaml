$kind: http-request
name: "Confirm: success"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "{{resetNewPassword}}",
      "confirmNewPassword": "{{resetNewPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Success message correct", () => {
          pm.expect(json.message).to.eql("Your password is updated. You can now sign in with your new password.");
      });
    language: text/javascript
order: 16000
