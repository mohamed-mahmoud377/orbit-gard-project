$kind: http-request
name: "Confirm: new password over 64 chars"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "{{tooLongPassword}}",
      "confirmNewPassword": "{{tooLongPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const longPass = "Aa1" + "x".repeat(65);
      pm.collectionVariables.set("tooLongPassword", longPass);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      const json = pm.response.json();
      pm.test("fieldErrors contains the max-length message", () => {
          const err = json.fieldErrors.find(fe => fe.field === "newPassword");
          pm.expect(err, "expected a fieldErrors entry for newPassword").to.exist;
          pm.expect(err.message).to.eql("Maximum 64 characters");
      });
    language: text/javascript
order: 9000
