$kind: http-request
name: "Confirm: invalid token"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "not-a-real-token",
      "newPassword": "ValidPass1",
      "confirmNewPassword": "ValidPass1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Token invalid error", () => {
          pm.expect(pm.response.json().code).to.eql("TOKEN_INVALID");
      });
    language: text/javascript
order: 11000
