$kind: http-request
name: "Confirm: new password too short"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "Ab1",
      "confirmNewPassword": "Ab1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Length rule message", () => {
          pm.expect(pm.response.text()).to.include("8 characters");
      });
    language: text/javascript
order: 8000
