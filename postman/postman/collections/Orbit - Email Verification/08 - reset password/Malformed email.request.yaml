$kind: http-request
url: "{{baseUrl}}/api/v1/password/reset/request"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "not-an-email"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Email format message", () => {
          pm.expect(pm.response.text()).to.include("valid email");
      });
    language: text/javascript
order: 2000
