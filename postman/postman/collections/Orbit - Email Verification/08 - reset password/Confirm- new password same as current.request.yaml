$kind: http-request
name: "Confirm: new password same as current"
url: "{{baseUrl}}/api/v1/password/reset/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "{{password}}",
      "confirmNewPassword": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Password reuse error", () => {
          pm.expect(pm.response.json().code).to.eql("PASSWORD_REUSE");
      });
    language: text/javascript
order: 13000
