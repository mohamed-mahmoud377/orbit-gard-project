$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{email}}",
      "password": "{{resetNewPassword}}",
      "rememberMe": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("New password accepted", () => pm.response.to.have.status(200));
    language: text/javascript
order: 19000
