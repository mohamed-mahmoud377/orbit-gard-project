$kind: http-request
name: "MANUAL: Request second reset link (invalidates first)"
description: After sending, copy the NEW raw token from the newly received email into resetToken (overwriting its old value). The old value has already been preserved in previousResetToken by the pre-request script.
url: "{{baseUrl}}/api/v1/password/reset/request"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("previousResetToken", pm.collectionVariables.get("resetToken"));
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 14000
