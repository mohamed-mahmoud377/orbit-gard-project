$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{email}}",
      "password": "{{password}}",
      "rememberMe": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.collectionVariables.set("resetRefreshTokenBeforeReset", json.refreshToken);
    language: text/javascript
order: 3000
