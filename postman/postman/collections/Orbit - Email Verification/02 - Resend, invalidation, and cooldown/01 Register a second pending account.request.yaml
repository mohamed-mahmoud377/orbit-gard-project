$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Orbit",
      "lastName": "Resend",
      "username": "{{username}}",
      "email": "{{email}}",
      "phoneNumber": "+201112345678",
      "password": "{{password}}",
      "confirmPassword": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 201', () => pm.response.to.have.status(201));
      console.log('Paste first email token into verificationToken, then run the next request.');
    language: text/javascript
order: 1000
