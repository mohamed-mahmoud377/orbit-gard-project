$kind: http-request
name: "04 MANUAL: Wait 120 seconds, then resend"
description: Wait the full 120 seconds after request 02. This returns another email; paste that latest token into verificationToken.
url: "{{baseUrl}}/api/v1/auth/verify/resend"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('returns 202 after the cooldown', () => pm.response.to.have.status(202));
    language: text/javascript
order: 4000
