$kind: http-request
url: "{{baseUrl}}/api/v1/auth/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "abc.def.ghi"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 400', () => pm.response.to.have.status(400));
      pm.test('reports invalid token', () => pm.expect(pm.response.json().code).to.eql('TOKEN_INVALID'));
    language: text/javascript
order: 1000
