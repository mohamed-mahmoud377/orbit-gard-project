$kind: http-request
description: Optional edge case — only reachable by manually deleting the child's SpendingLimit row via SQL first, since add-child always creates one in the same transaction as the child. Expect 500 (NoSuchElementException) — a hard failure, not silent unlimited spending.
url: "{{baseUrl}}/api/v1/wallet/internal/transfer"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "receiverUsername": "{{receiverUsername}}",
      "amount": 10.00
    }
auth:
  type: bearer
  credentials:
    token: "{{childAccessToken}}"
order: 16000
