$kind: http-request
description: Run an internal transfer (reuse the /wallet/internal/transfer request above, as the child) that uses up most of today's remaining daily limit first, then immediately run this /external/pay request for an amount that would push the COMBINED daily total over dailyLimit=500.00. Expect 422, code daily-limit-exceeded. This is the most important test in the collection — it proves sumCompletedDebitsBetween correctly counts debits from both endpoints against the same walletId, so a child can't dodge their limit by switching channels. Re-run 07a first for a fresh token.
url: "{{baseUrl}}/api/v1/external/pay"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "verificationToken": "{{externalPaymentToken}}",
      "merchantName": "Test Merchant",
      "productName": "Test Product",
      "cashAmount": 100.00
    }
order: 15000
