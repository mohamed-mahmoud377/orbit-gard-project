$kind: http-request
description: Confirm manually that no email arrives. Current API intentionally returns a generic success response.
url: "{{baseUrl}}/api/v1/auth/verify/resend"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('returns 202', () => pm.response.to.have.status(202));
    language: text/javascript
order: 6000
