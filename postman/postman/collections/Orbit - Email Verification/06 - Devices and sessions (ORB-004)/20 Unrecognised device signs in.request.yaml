$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  User-Agent: X
body:
  type: text
  content: |-
    {
      "username": "{{email}}",
      "password": "{{password}}",
      "rememberMe": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('sessionAccessTokenUnrecognised', pm.response.json().accessToken);
    language: text/javascript
order: 21000
