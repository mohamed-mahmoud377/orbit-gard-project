$kind: http-request
name: "06 List shows one entry per device, current marked, fields present (AC: one entry each, this device marked, device/location/last-used visible, new device appears)"
url: "{{baseUrl}}/api/v1/sessions"
method: GET
headers:
  Authorization: Bearer {{sessionAccessTokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('exactly two active sessions', () => pm.expect(body.length).to.eql(2));
      const current = body.filter(s => s.currentDevice === true);
      pm.test('exactly one entry is marked as the current device', () => pm.expect(current.length).to.eql(1));
      const other = body.find(s => s.currentDevice === false);
      pm.test('every entry has device, last-used, and location fields present', () => body.forEach(s => { pm.expect(s).to.have.property('deviceLabel'); pm.expect(s).to.have.property('lastUsedAt'); pm.expect(s).to.have.property('location'); }));
      pm.collectionVariables.set('sessionIdCurrentA', current[0].id);
      pm.collectionVariables.set('sessionIdOtherB', other.id);
    language: text/javascript
order: 6000
