$kind: http-request
url: "{{baseUrl}}/payments/webhook/paymob"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "obj": {
        "id": "0000000000000000000",
        "event": "invoice.paid",
        "transaction": {
          "amount_cents": 1000,
          "currency": "EGP"
        }
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Webhook accepted', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
