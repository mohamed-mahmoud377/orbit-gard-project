$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}",
      "rememberMe": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeded', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set('accessToken', pm.response.json().accessToken);
    language: text/javascript
order: 1000
