$kind: http-request
description: Confirms the 403 rejected the write rather than only the response.
url: "{{baseUrl}}/family/children/{{childAId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Money arrives as JSON numbers; compare in integer cents so 0.1+0.2 never bites.
      const cents = (v) => Math.round(Number(v) * 100);
      const c = pm.response.json();
      pm.test('Monthly ceiling still 2000.00, not the value the child sent', () => {
          pm.expect(cents(c.limits.month.max)).to.eql(200000);
      });
    language: text/javascript
order: 8000
