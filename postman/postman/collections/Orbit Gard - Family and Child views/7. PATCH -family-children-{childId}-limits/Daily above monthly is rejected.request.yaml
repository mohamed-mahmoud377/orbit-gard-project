$kind: http-request
url: "{{baseUrl}}/family/children/{{childAId}}/limits"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dailyLimit": 5000.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('LIMIT_ORDER_INVALID attributed to monthlyLimit', () => {
          const fe = pm.response.json().fieldErrors || [];
          const hit = fe.find(e => e.field === 'monthlyLimit');
          pm.expect(hit).to.not.be.undefined;
          pm.expect(hit.code).to.eql('LIMIT_ORDER_INVALID');
      });
    language: text/javascript
order: 3000
