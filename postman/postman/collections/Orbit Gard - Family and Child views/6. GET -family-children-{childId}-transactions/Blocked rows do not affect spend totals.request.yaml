$kind: http-request
url: "{{baseUrl}}/family/children/{{childAId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Money arrives as JSON numbers; compare in integer cents so 0.1+0.2 never bites.
      const cents = (v) => Math.round(Number(v) * 100);
      const c = pm.response.json();
      // Every spend aggregate filters status = COMPLETED, so a REJECTED row
      // must not move today.spent even though it sits in the same table.
      pm.test('today.spent still equals only the successful spend', () => {
          pm.expect(cents(c.limits.today.spent))
              .to.eql(cents(pm.collectionVariables.get('spendAmount')));
      });
    language: text/javascript
order: 4000
