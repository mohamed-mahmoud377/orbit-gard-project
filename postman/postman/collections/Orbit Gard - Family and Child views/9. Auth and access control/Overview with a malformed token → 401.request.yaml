$kind: http-request
description: auth is noauth so Postman does not overwrite the header with the real token. JwtAuthenticationFilter catches the parse failure and leaves the context anonymous, so a garbage token is rejected the same way a missing one is — never a 500.
url: "{{baseUrl}}/family/overview"
method: GET
headers:
  Authorization: Bearer {{supabase_service_role_api_key_18ki}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('UNAUTHENTICATED', () => pm.expect(pm.response.json().code).to.eql('UNAUTHENTICATED'));
    language: text/javascript
order: 9000
