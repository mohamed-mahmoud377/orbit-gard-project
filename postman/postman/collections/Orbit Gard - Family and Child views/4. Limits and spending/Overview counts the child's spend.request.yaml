$kind: http-request
url: "{{baseUrl}}/family/overview"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Money arrives as JSON numbers; compare in integer cents so 0.1+0.2 never bites.
      const cents = (v) => Math.round(Number(v) * 100);
      const b = pm.response.json();
      const before = cents(pm.collectionVariables.get('snapSpent'));
      const spent = cents(pm.collectionVariables.get('spendAmount'));

      pm.test('spentThisMonth rose by the amount spent', () => {
          pm.expect(cents(b.spentThisMonth)).to.eql(before + spent);
      });

      // The refused payment above was written as a REJECTED row by
      // BlockedAttemptRecorder in its own REQUIRES_NEW transaction, so it
      // survived the rollback the 422 triggered. If this reads flat, the
      // audit row is being rolled back with the caller's transaction.
      pm.test('blockedAttempts recorded the refused payment', () => {
          pm.expect(b.blockedAttempts).to.eql(Number(pm.collectionVariables.get('snapBlocked')) + 1);
      });
    language: text/javascript
order: 5000
