spring:
  application:
    name: orbit-graduation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbit}
    username: ${DB_USERNAME:orbit}
    password: ${DB_PASSWORD:orbit123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:NIx1lJRGsRUuAbhJfPdcnJksasyuQXFADiFjj2m72oY=}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
