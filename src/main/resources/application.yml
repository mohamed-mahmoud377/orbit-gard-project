spring:
  application:
    name: orbit-graduation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbit}
    username: ${DB_USERNAME:orbit}
    password: ${DB_PASSWORD:orbit123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}

orbitgard:
  jwt:
    secret: ThisIsMyVerySecureJwtSecretKeyThatIsLongEnough123456789
    access-token-ttl-seconds: 300
